<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Java Inheritance - Core Java Programming</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" href="favicon.png" type="image/png">
</head>

<body>

    <nav>
        <div class="logo">JavaPro</div>
        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="about.html">About</a></li>
            <li><a href="index.html#topics">TOPICS</a></li>
        </ul>
    </nav>

    <header>
        <h1>Core Java Programming -Inheritance </h1>
        <p>Practice and learn Java Inheritance programs with output and explanations</p>
    </header>

    <main>
        <aside class="sidebar">
            <h3>Inheritance Menu</h3>
            <ul id="menuList"></ul>
        </aside>

        <section id="programs">
            <h2>Core Java Programming - Practice Problems</h2>

            <!-- JavaScript will insert all programs here dynamically -->
        </section>
    </main>

    <script>
        // --- Configuration: Point to the combined JSON file ---
        const DATA_FILE = 'all_programs_with_outputs.json';

        const section = document.getElementById("programs");
        const menuList = document.getElementById("menuList");

        // --- NEW LOGIC: Extract Category from URL Filename ---
        // 1. Get the full path (e.g., "/my-project/Strings.html")
        const pathname = window.location.pathname;

        // 2. Extract the filename (e.g., "Strings.html")
        const filename = pathname.substring(pathname.lastIndexOf('/') + 1);

        // 3. Remove the ".html" extension to get the category (e.g., "Strings")
        const currentCategory = filename.replace(/\.html$/i, '');
        // --------------------------------------------------------

        fetch(DATA_FILE)
            .then(response => {
                if (!response.ok) {
                    // If the file isn't found or loaded correctly
                    throw new Error(`HTTP error! Status: ${response.status}. Did you run 'python build_programs.py'?`);
                }
                return response.json();
            })
            .then(allPrograms => {
                // 1. Filter the programs array based on the extracted category
                const filteredPrograms = allPrograms.filter(prog =>
                    prog.category && prog.category.toLowerCase() === currentCategory.toLowerCase()
                );

                if (filteredPrograms.length === 0) {
                    section.innerHTML = `<h2>No programs found for the category: "${currentCategory}".</h2><p>Please check your JSON data and the HTML filename.</p>`;
                    return;
                }

                // 2. Render the filtered programs dynamically
                filteredPrograms.forEach((prog, i) => {
                    const div = document.createElement("div");
                    div.className = "program";
                    // Create an anchor ID based on the title for easy linking
                    const anchorId = prog.title.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
                    div.id = anchorId;

                    // Replace the stored '\n' newlines with HTML line breaks (<br>) for display
                    const displayOutput = prog.output.replace(/\\n/g, '<br>');

                    div.innerHTML = `
    <h3>${prog.title}</h3>
    <pre>${prog.code}</pre>
    <div class="output"><strong>Output:</strong> ${displayOutput}</div>`;
                    section.appendChild(div);

                    // Create the navigation link
                    const li = document.createElement("li");
                    li.innerHTML = `<a href="#${anchorId}">${prog.title}</a>`;
                    menuList.appendChild(li);
                });
            })
            .catch(e => {
                console.error("Error loading program data:", e);
                section.innerHTML = `<h2>Data Error</h2><p>Could not load programs from ${DATA_FILE}. Please check the console for details.</p>`;
            });
    </script>

</body>

</html>
