<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Java GUI_Swings - Core Java Programming</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" href="favicon.png" type="image/png">
</head>

<body>

    <nav>
        <div class="logo">JavaPro</div>
        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="about.html">About</a></li>
            <li><a href="index.html#topics">TOPICS</a></li>
        </ul>
    </nav>

    <header>
        <h1>Core Java Programming - GUI_Swings</h1>
        <p>Practice and learn Java GUI_Swings programs with output and explanations</p>
    </header>

    <main>
        <aside class="sidebar">
            <h3>GUI_Swings-Menu</h3>
            <ul id="menuList"></ul>
        </aside>

        <section id="programs">
            <h2>Core Java Programming - Practice Problems</h2>

            <!-- JavaScript will insert all programs here dynamically -->
        </section>
    </main>

    <script>
        const programs = []

        const section = document.getElementById("programs");
        const menuList = document.getElementById("menuList");

        programs.forEach((prog, i) => {
            const div = document.createElement("div");
            div.className = "program";
            div.id = "prog" + (i + 1);
            div.innerHTML = `
    <h3>${prog.title}</h3>
    <pre>${prog.code}</pre>
    <div class="output"><strong>Output:</strong> ${prog.output}</div>`;
            section.appendChild(div);

            const li = document.createElement("li");
            li.innerHTML = `<a href="#prog${i + 1}">${prog.title}</a>`;
            menuList.appendChild(li);
        });
    </script>

</body>

</html>
